<title>VOLT DJ Prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: prototype toolbar + resizable "device" frame (container queries) so one build reviews móvil / tablet / escritorio.
   Brand tokens: single dark look by decision of the brief. Every value below is the ONE source of truth. */
:root {
  /* Marca (configurable) */
  --bg: #101114;
  --surface: #191B20;
  --surface-2: #22252B;
  --fg: #F5F5F5;
  --fg-2: #A7A9B0;
  --accent: #B8FF32;
  --accent-ink: #101114;
  --border: #30323A;
  /* Pozo fotográfico: claro para que las fotos de fabricante (fondo blanco) encajen */
  --photo: #E7E8EB;
  --art-ink: #1C1E23;
  --art-mid: #3A3D45;
  --art-hi: #8A8E98;
  /* Semántica de disponibilidad (independiente del acento) */
  --ok: #5BD28A;
  --warn: #F2B544;
  --info: #7DB4FF;
  --off: #6B6E77;
  --danger: #FF6B5E;
  --ph: #F2B544;
  /* Tipografía */
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --t-xs: .75rem; --t-sm: .875rem; --t-md: 1rem; --t-lg: 1.25rem; --t-xl: 1.75rem; --t-2xl: 2.5rem; --t-3xl: 3.5rem;
  /* Espaciado y forma */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
  --r: 4px; --r-lg: 6px;
  --tool-h: 52px;
  --chrome: #0A0B0D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--chrome); color: var(--fg); font-family: var(--f-body); font-size: var(--t-md); line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--chrome); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-display); font-stretch: 115%; font-weight: 800; text-transform: uppercase; letter-spacing: -.005em; line-height: 1.02; }
.eyebrow { font-family: var(--f-mono); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); }
.ph { outline: 1px dashed var(--ph); outline-offset: 2px; color: var(--ph); font-style: normal; }
.ph::before { content: "⟨"; } .ph::after { content: "⟩"; }

/* ---------- Prototype toolbar ---------- */
.tool { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--tool-h); display: flex; align-items: center; gap: var(--s3);
  background: var(--chrome); border-bottom: 1px solid var(--border);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
.tool .tag { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--fg-2); white-space: nowrap; }
.tool nav, .tool .dev { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 2px; flex-shrink: 0; }
.tool nav a, .tool .dev button { font-family: var(--f-mono); font-size: var(--t-xs); text-decoration: none; padding: 6px 10px; border-radius: 3px; color: var(--fg-2); background: none; border: 0; white-space: nowrap; }
.tool nav a[aria-current="page"], .tool .dev button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.tool .spacer { flex: 1; }

.stage { padding-block: var(--s5) var(--s8); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.device { container: shop / inline-size; margin: 0 auto; max-width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg); transition: width .25s ease; width: 100%; }
.device[data-w="tablet"] { width: 820px; }
.device[data-w="mobile"] { width: 390px; }
.devnote { text-align: center; margin-top: var(--s3); font-family: var(--f-mono); font-size: var(--t-xs); color: var(--fg-2); }

/* ---------- Shop shell ---------- */
.wrap { padding-inline: var(--s4); margin: 0 auto; max-width: 1240px; }
@container shop (min-width: 720px) { .wrap { padding-inline: var(--s6); } }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); font-size: var(--t-xs); color: var(--fg-2); }
.topbar .wrap { display: flex; gap: var(--s5); justify-content: center; padding-block: 8px; overflow-x: auto; white-space: nowrap; }
.topbar .wrap > span:nth-child(n+2) { display: none; }
@container shop (min-width: 720px) { .topbar .wrap { justify-content: space-between; } .topbar .wrap > span:nth-child(n+2) { display: inline; } }

.hdr { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--tool-h)); z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.hdr .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--s3); padding-block: var(--s3); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.logo svg { width: 28px; height: 28px; }
.logo b { font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: 1.15rem; letter-spacing: .02em; }
.logo b i { font-style: normal; color: var(--fg-2); font-weight: 500; font-stretch: 100%; }
.search { display: none; position: relative; }
.search input { width: 100%; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 0 var(--s4) 0 40px; }
.search input::placeholder { color: var(--fg-2); }
.search svg { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--fg-2); }
.hdr .actions { display: flex; gap: var(--s2); justify-self: end; grid-column: 3; }
.iconbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 44px; height: 44px; padding: 0 10px; background: none; border: 1px solid var(--border); border-radius: var(--r); text-decoration: none; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .lbl { display: none; font-size: var(--t-sm); font-weight: 600; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 700 11px/20px var(--f-mono); text-align: center; }
.msearch { padding-bottom: var(--s3); }
.msearch .search { display: block; }
.catnav { border-top: 1px solid var(--border); }
.catnav .wrap { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; padding-block: 6px; }
.catnav button { flex-shrink: 0; background: none; border: 0; padding: 8px 10px; font-size: var(--t-sm); color: var(--fg-2); border-radius: var(--r); white-space: nowrap; }
.catnav button:hover, .catnav button[aria-current="true"] { color: var(--fg); background: var(--surface); }
.catnav button.hot { color: var(--accent); }
@container shop (min-width: 900px) {
  .hdr .row { grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s6); }
  .hdr .row .search { display: block; max-width: 560px; }
  .msearch { display: none; }
  .iconbtn .lbl { display: inline; }
}

main.view { min-height: 60vh; }
.sec { padding-block: var(--s7); }
.sec + .sec { border-top: 1px solid var(--border); }
.sechead { display: flex; align-items: end; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s5); }
.sechead h2 { font-size: var(--t-xl); }
.sechead p { color: var(--fg-2); margin-top: 6px; max-width: 60ch; }
.link { color: var(--fg); font-size: var(--t-sm); font-weight: 600; white-space: nowrap; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--border); }
.link:hover { text-decoration-color: var(--accent); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 var(--s5); border-radius: var(--r); font-weight: 700; font-size: var(--t-md); text-decoration: none; border: 1px solid transparent; white-space: nowrap; }
.btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-secondary { background: var(--surface-2); color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--fg-2); }
.btn-ghost { background: none; color: var(--fg); border-color: var(--border); }
.btn-sm { height: 40px; padding: 0 var(--s4); font-size: var(--t-sm); }
.btn[disabled], .btn[aria-disabled="true"] { background: var(--surface-2); color: var(--off); border-color: var(--border); cursor: not-allowed; filter: none; }
.btn-block { width: 100%; }

/* Hero */
.hero { padding-block: var(--s6) var(--s7); }
.hero .grid { display: grid; gap: var(--s5); }
.hero h1 { font-size: clamp(2.2rem, 9cqi, 4.5rem); }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { color: var(--fg-2); font-size: var(--t-lg); margin-top: var(--s4); max-width: 46ch; }
.hero .ctas { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s5); }
.hero .shot { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r-lg); background: radial-gradient(120% 90% at 70% 30%, #23262D, #121317 70%); border: 1px solid var(--border); overflow: hidden; display: grid; place-items: center; }
.hero .shot svg { width: 88%; }
.hero .shot .cap { position: absolute; left: var(--s3); bottom: var(--s3); font-family: var(--f-mono); font-size: var(--t-xs); background: var(--bg); border: 1px dashed var(--ph); color: var(--ph); padding: 4px 8px; border-radius: var(--r); }
@container shop (min-width: 900px) { .hero .grid { grid-template-columns: 1.05fr 1fr; align-items: center; gap: var(--s7); } }

/* Meter motif (marca): barra de nivel por segmentos */
.meter { display: inline-flex; gap: 3px; align-items: end; height: 14px; }
.meter i { width: 4px; background: var(--border); }
.meter i.on { background: var(--fg-2); }
.meter i.pk { background: var(--accent); }

/* Categories */
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
@container shop (min-width: 720px) { .cats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cat { display: grid; grid-template-rows: auto auto; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 0; overflow: hidden; }
.cat:hover { border-color: var(--fg-2); }
.cat .ph-img { aspect-ratio: 16 / 10; background: var(--photo); display: grid; place-items: center; }
.cat .ph-img svg { width: 62%; height: 80%; }
.cat .meta { padding: var(--s3) var(--s4); display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.cat .meta b { font-size: var(--t-sm); }
.cat .meta span { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--fg-2); }

/* Product grid & card */
.grid-p { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
@container shop (min-width: 720px) { .grid-p { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); } }
@container shop (min-width: 1080px) { .grid-p { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid-p.in-cat { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; min-width: 0; }
.card:hover { border-color: #474A54; }
.card .img { position: relative; aspect-ratio: 1; background: var(--photo); display: grid; place-items: center; border: 0; padding: 0; width: 100%; }
.card .img svg { width: 72%; height: 72%; }
.card .flag { position: absolute; top: var(--s2); left: var(--s2); background: var(--accent); color: var(--accent-ink); font: 700 var(--t-xs)/1 var(--f-mono); padding: 5px 7px; border-radius: 2px; }
.card .demo { position: absolute; top: var(--s2); right: var(--s2); background: var(--art-ink); color: var(--photo); font: 500 10px/1 var(--f-mono); padding: 4px 6px; border-radius: 2px; letter-spacing: .06em; }
.card .body { display: flex; flex-direction: column; gap: 6px; padding: var(--s3); flex: 1; }
@container shop (min-width: 720px) { .card .body { padding: var(--s4); } }
.card .brand { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--fg-2); text-transform: uppercase; letter-spacing: .06em; }
.card .name { font-weight: 600; font-size: var(--t-sm); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: calc(1.35em * 2); background: none; border: 0; padding: 0; text-align: left; }
@container shop (min-width: 720px) { .card .name { font-size: var(--t-md); } }
.price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-variant-numeric: tabular-nums; }
.price b { font-size: var(--t-lg); font-weight: 700; }
.price s { color: var(--fg-2); font-size: var(--t-sm); }
.price .tbc { font-size: var(--t-sm); color: var(--fg-2); font-weight: 600; }
.card .foot { margin-top: auto; display: grid; grid-template-columns: 1fr auto; gap: var(--s2); padding-top: var(--s2); }
.card .foot .btn { height: 40px; padding: 0 var(--s3); font-size: var(--t-sm); }
.card .foot .wa { width: 40px; padding: 0; }

/* Availability LED */
.avail { display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-xs); font-weight: 600; color: var(--fg-2); }
.avail::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 20%, transparent); }
.avail[data-a="disponible"] { color: var(--ok); }
.avail[data-a="pocas"] { color: var(--warn); }
.avail[data-a="bajo_pedido"] { color: var(--info); }
.avail[data-a="agotado"] { color: var(--off); }
.avail[data-a="consultar"] { color: var(--fg-2); }

/* Brands, benefits, info */
.brands { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
@container shop (min-width: 720px) { .brands { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.brands div { height: 72px; display: grid; place-items: center; border: 1px dashed var(--border); border-radius: var(--r); font-family: var(--f-mono); font-size: var(--t-xs); color: var(--fg-2); text-align: center; padding: var(--s2); }
.benefits { display: grid; gap: var(--s4); }
@container shop (min-width: 720px) { .benefits { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s5); } }
.benefit { display: grid; gap: var(--s2); align-content: start; }
.benefit svg { width: 28px; height: 28px; color: var(--accent); }
.benefit b { font-size: var(--t-md); }
.benefit p { color: var(--fg-2); font-size: var(--t-sm); }
.split { display: grid; gap: var(--s4); }
@container shop (min-width: 720px) { .split { grid-template-columns: 1fr 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: var(--s5); display: grid; gap: var(--s3); align-content: start; }
.panel h3 { font-size: var(--t-lg); }
.panel ul { margin: 0; padding-left: 1.1em; color: var(--fg-2); display: grid; gap: 6px; font-size: var(--t-sm); }
.faq { display: grid; gap: 0; border-top: 1px solid var(--border); max-width: 820px; }
.faq details { border-bottom: 1px solid var(--border); }
.faq summary { cursor: pointer; list-style: none; padding: var(--s4) 0; font-weight: 600; display: flex; justify-content: space-between; gap: var(--s4); }
.faq summary::after { content: "+"; font-family: var(--f-mono); color: var(--fg-2); }
.faq details[open] summary::after { content: "–"; }
.faq details p { padding-bottom: var(--s4); color: var(--fg-2); max-width: 65ch; }

footer.ft { background: var(--surface); border-top: 1px solid var(--border); padding-block: var(--s7) var(--s5); font-size: var(--t-sm); color: var(--fg-2); }
.ft .cols { display: grid; gap: var(--s5); grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container shop (min-width: 720px) { .ft .cols { grid-template-columns: 1.4fr repeat(3, 1fr); } }
.ft .cols > div:first-child { grid-column: 1 / -1; }
@container shop (min-width: 720px) { .ft .cols > div:first-child { grid-column: auto; } }
.ft h4 { margin: 0 0 var(--s3); color: var(--fg); font-size: var(--t-sm); }
.ft ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ft .legal { margin-top: var(--s6); padding-top: var(--s4); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); justify-content: space-between; font-size: var(--t-xs); }

/* Catalog */
.crumbs { font-size: var(--t-xs); color: var(--fg-2); padding-top: var(--s5); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--fg-2); text-decoration: underline; text-underline-offset: 3px; }
.cathead { padding-block: var(--s3) var(--s5); display: grid; gap: var(--s2); }
.cathead h1 { font-size: clamp(1.8rem, 6cqi, 2.75rem); }
.cathead p { color: var(--fg-2); }
.catlayout { display: grid; gap: var(--s5); padding-bottom: var(--s7); }
@container shop (min-width: 900px) { .catlayout { grid-template-columns: 248px minmax(0, 1fr); gap: var(--s6); } }
.filters { display: none; }
@container shop (min-width: 900px) { .filters { display: grid; gap: var(--s5); align-content: start; position: sticky; top: calc(var(--tool-h) + 150px); } .fbtn { display: none !important; } }
.filters.open { display: grid; gap: var(--s5); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: var(--s4); }
.fgroup { display: grid; gap: var(--s2); }
.fgroup h3 { font-family: var(--f-mono); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); font-weight: 500; }
.check { display: flex; align-items: center; gap: 10px; font-size: var(--t-sm); min-height: 32px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.check .n { margin-left: auto; font-family: var(--f-mono); font-size: var(--t-xs); color: var(--fg-2); }
.range { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.field { display: grid; gap: 6px; }
.field label { font-size: var(--t-xs); color: var(--fg-2); }
.input, select.input { height: 44px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 0 var(--s3); width: 100%; min-width: 0; }
.toolbar-c { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
.toolbar-c .count { font-size: var(--t-sm); color: var(--fg-2); }
.toolbar-c .r { display: flex; gap: var(--s2); align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s4); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); font-size: var(--t-xs); }
.chip button { background: none; border: 0; color: var(--fg-2); padding: 0 2px; }

/* Empty / skeleton / alerts */
.empty { display: grid; justify-items: center; text-align: center; gap: var(--s3); padding: var(--s7) var(--s4); border: 1px dashed var(--border); border-radius: var(--r); }
.empty svg { width: 40px; height: 40px; color: var(--fg-2); }
.empty p { color: var(--fg-2); max-width: 40ch; }
.sk { background: linear-gradient(90deg, var(--surface-2) 0%, #2B2E35 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: sk 1.4s linear infinite; border-radius: 3px; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .device { transition: none; } }
.alert { display: grid; grid-template-columns: auto 1fr; gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); font-size: var(--t-sm); }
.alert svg { width: 20px; height: 20px; margin-top: 1px; }
.alert b { display: block; }
.alert p { color: var(--fg-2); }
.alert.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); } .alert.warn svg { color: var(--warn); }
.alert.err { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); } .alert.err svg { color: var(--danger); }
.alert.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); } .alert.ok svg { color: var(--ok); }
.alert.info svg { color: var(--fg-2); }

/* Product detail */

/* ================= Lógica (fase 2: src/lib/*) ================= */
const fmt = (n) => new Intl.NumberFormat(STORE.locale, { style: "currency", currency: STORE.currency, maximumFractionDigits: 0 }).format(n);
const byId = (id) => PRODUCTS.find((p) => p.id === id);
const unitPrice = (p) => (p.price == null ? null : (p.promoPrice ?? p.price));
const canAdd = (p) => p.availability !== "agotado";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const cart = {
  items: [],
  load() { try { const raw = localStorage.getItem("voltdj.cart.v1"); if (raw) this.items = JSON.parse(raw).filter((i) => i && typeof i.id === "string" && Number.isInteger(i.qty)); } catch (e) {} },
  save() { try { localStorage.setItem("voltdj.cart.v1", JSON.stringify(this.items)); } catch (e) {} updateBadge(); },
  add(id, qty = 1) {
    const p = byId(id); if (!p || !canAdd(p)) return false;
    const line = this.items.find((i) => i.id === id);
    const next = Math.min((line ? line.qty : 0) + qty, p.maxQty);
    if (line) line.qty = next; else this.items.push({ id, qty: next });
    this.save(); return true;
  },
  setQty(id, qty) { const p = byId(id); const line = this.items.find((i) => i.id === id); if (!line) return; line.qty = Math.max(1, Math.min(qty | 0 || 1, p ? p.maxQty : 1)); this.save(); },
  remove(id) { this.items = this.items.filter((i) => i.id !== id); this.save(); },
  clear() { this.items = []; this.save(); },
  /* Resuelve contra el catálogo: precio actual, descontinuados y agotados. */
  resolve() {
    const lines = this.items.map((i) => { const p = byId(i.id); if (!p) return { id: i.id, qty: i.qty, missing: true }; const u = unitPrice(p); return { p, qty: i.qty, unit: u, total: u == null ? null : u * i.qty }; });
    const priced = lines.filter((l) => !l.missing && l.total != null && l.p.availability !== "agotado");
    return { lines, subtotal: priced.reduce((s, l) => s + l.total, 0), units: this.items.reduce((s, i) => s + i.qty, 0), hasUnpriced: lines.some((l) => !l.missing && l.unit == null), hasIssues: lines.some((l) => l.missing || (l.p && l.p.availability === "agotado")) };
  },
};

let orderId = null;
const newOrderId = () => { const d = new Date(); const ymd = String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); const rnd = Math.random().toString(36).slice(2, 6).toUpperCase(); return `${STORE.orderPrefix}-${ymd}-${rnd}`; };

const whatsapp = {
  buildOrderMessage({ lines, subtotal, hasUnpriced }, { orderId, city }) {
    const out = [`Hola ${STORE.name}, quiero consultar este pedido.`, `Pedido provisional: ${orderId}`, ""];
    lines.filter((l) => !l.missing && l.p.availability !== "agotado").forEach((l, i) => {
      out.push(`${i + 1}. ${l.p.name}`);
      out.push(`   Ref.: ${l.p.sku}`);
      out.push(`   Cantidad: ${l.qty}`);
      out.push(l.unit == null ? "   Precio: por confirmar" : `   Precio unitario: ${fmt(l.unit)} · Total: ${fmt(l.total)}`);
    });
    out.push("", `Subtotal estimado: ${fmt(subtotal)}${hasUnpriced ? " (sin incluir productos con precio por confirmar)" : ""}`, "No incluye envío.");
    if (city && city.trim()) out.push(`Ciudad de envío: ${city.trim().slice(0, 60)}`);
    out.push("", "¿Me confirman disponibilidad, costo de envío y tiempo de entrega?");
    return out.join("\n");
  },
  buildProductMessage(p) {
    const u = unitPrice(p);
    return [`Hola ${STORE.name}, quiero información sobre este producto:`, `${p.name}`, `Ref.: ${p.sku}`, u == null ? "Precio: por confirmar" : `Precio publicado: ${fmt(u)}`, "", "¿Está disponible y cuánto cuesta el envío?"].join("\n");
  },
  link(text) { return `https://wa.me/${STORE.whatsappNumber || "57XXXXXXXXXX"}?text=${encodeURIComponent(text)}`; },
  configured() { return /^\d{10,15}$/.test(STORE.whatsappNumber); },
};

function availEl(a) { return `<span class="avail" data-a="${a}">${AVAIL[a]}</span>`; }

  if (p.price == null) return `<div class="price"><span class="tbc">Precio por confirmar</span></div>`;
  if (p.promoPrice != null) return `<div class="price"><b>${fmt(p.promoPrice)}</b><s aria-label="Precio anterior">${fmt(p.price)}</s></div>`;
  return `<div class="price"><b>${fmt(p.price)}</b></div>`;
}
function pct(p) { return p.promoPrice != null && p.price ? Math.round((1 - p.promoPrice / p.price) * 100) : 0; }

function filtered() {
  const q = state.q.trim().toLowerCase();
  let list = PRODUCTS.filter((p) =>
    (!state.cat || p.category === state.cat) &&
    (!q || [p.name, p.brand, p.sku, CATEGORIES.find((c) => c.id === p.category).name].join(" ").toLowerCase().includes(q)) &&
    (!state.brands.size || state.brands.has(p.brand)) &&
    (!state.avail.size || state.avail.has(p.availability)) &&
    (!state.onlyPromo || p.promoPrice != null) &&
    (state.min === "" || (unitPrice(p) ?? Infinity) >= +state.min) &&
    (state.max === "" || (unitPrice(p) ?? -1) <= +state.max && unitPrice(p) != null));
  const val = (p) => unitPrice(p);
  if (state.sort === "asc") list = list.slice().sort((a, b) => (val(a) ?? Infinity) - (val(b) ?? Infinity));
  if (state.sort === "desc") list = list.slice().sort((a, b) => (val(b) ?? -1) - (val(a) ?? -1));
  return list;
}
function catalogView() {
  const cat = CATEGORIES.find((c) => c.id === state.cat);

    ...(state.onlyPromo ? [["Con promoción", "promo"]] : []),

    <nav class="crumbs" aria-label="Ruta"><button data-go="inicio">Inicio</button><span>/</span><button data-cat="">Catálogo</button>${cat ? `<span>/</span><span>${cat.name}</span>` : ""}</nav>
    <div class="cathead"><h1 class="disp">${title}</h1><p>${cat ? "Equipos de la categoría con precio y disponibilidad según el catálogo." : "Todos los productos publicados. Filtra por marca, precio o disponibilidad."}</p></div>
    <div class="catlayout">

        <div class="fgroup"><h3>Marca</h3>${brands.map((b) => `<label class="check"><input type="checkbox" value="${b}" ${state.brands.has(b) ? "checked" : ""} data-f="brand">${b}<span class="n">${base.filter((p) => p.brand === b).length}</span></label>`).join("")}</div>
        <div class="fgroup"><h3>Precio (COP)</h3><div class="range"><div class="field"><label for="pmin">Mínimo</label><input class="input num" id="pmin" inputmode="numeric" value="${state.min}" data-f="min" placeholder="0"></div><div class="field"><label for="pmax">Máximo</label><input class="input num" id="pmax" inputmode="numeric" value="${state.max}" data-f="max" placeholder="Sin límite"></div></div></div>
        <div class="fgroup"><h3>Disponibilidad</h3>${Object.keys(AVAIL).map((a) => `<label class="check"><input type="checkbox" value="${a}" ${state.avail.has(a) ? "checked" : ""} data-f="avail">${AVAIL[a]}</label>`).join("")}</div>

      </aside>
      <div style="min-width:0">
        <div class="toolbar-c">
          <span class="count" aria-live="polite">${list.length} ${list.length === 1 ? "producto" : "productos"}</span>
          <div class="r">
            <button class="btn btn-ghost btn-sm fbtn" data-act="filters" aria-expanded="${state.filtersOpen}">${ICON.filter} Filtros${chips.length ? ` (${chips.length})` : ""}</button>
            <label class="srh" for="sort">Ordenar</label>
            <select class="input" id="sort" data-f="sort" style="width:auto;height:40px"><option value="rel" ${state.sort === "rel" ? "selected" : ""}>Relevancia</option><option value="asc" ${state.sort === "asc" ? "selected" : ""}>Menor precio</option><option value="desc" ${state.sort === "desc" ? "selected" : ""}>Mayor precio</option></select>

        ${list.length ? `<div class="grid-p in-cat">${list.map(card).join("")}</div>` :
          `<div class="empty">${ICON.search}<b>No encontramos productos con esos criterios</b><p>Revisa la ortografía, quita algún filtro o pregúntanos por WhatsApp: también conseguimos equipos bajo pedido.</p><div class="row-wrap" style="justify-content:center"><button class="btn btn-secondary btn-sm" data-act="clearf">Quitar filtros</button><a class="btn btn-ghost btn-sm" href="${whatsapp.link(`Hola ${STORE.name}, busco: ${state.q || "un equipo"}. ¿Lo tienen o lo pueden conseguir?`)}" target="_blank" rel="noopener" data-wa>${ICON.wa} Preguntar por WhatsApp</a></div></div>`}
      </div>

function cartLines(lines, editable) {
  return lines.map((l) => {
    if (l.missing) return `<div class="line"><div class="thumb"></div><div class="info"><b>Producto ya no disponible</b><span class="note">Ref. ${esc(l.id)} fue retirado del catálogo. No se incluirá en el pedido.</span></div><div class="ctrl"><button class="rm" data-rm="${esc(l.id)}">Eliminar</button></div></div>`;
    const p = l.p;
    return `<div class="line">
      <button class="thumb" data-open="${p.id}" aria-label="Ver ${esc(p.name)}" style="border:0;padding:0">${ART[p.art]}</button>
      <div class="info"><span class="brand eyebrow">${esc(p.brand)}</span><b>${esc(p.name)}</b><span class="note mono">Ref. ${p.sku}</span>${availEl(p.availability)}
        ${l.unit == null ? `<span class="note">Precio por confirmar · no suma al subtotal</span>` : `<span class="note num">${fmt(l.unit)} c/u</span>`}
        ${p.availability === "agotado" ? `<span class="note" style="color:var(--warn)">Se agotó después de añadirlo. No se incluirá en el mensaje.</span>` : ""}
      </div>
      <div class="ctrl">
        ${editable ? `<div class="stepper sm" role="group" aria-label="Cantidad de ${esc(p.name)}"><button data-q="${p.id}" data-d="-1" aria-label="Disminuir" ${l.qty <= 1 ? "disabled" : ""}>−</button><input class="num" value="${l.qty}" data-qi="${p.id}" inputmode="numeric" aria-label="Cantidad"><button data-q="${p.id}" data-d="1" aria-label="Aumentar" ${l.qty >= p.maxQty ? "disabled" : ""}>+</button></div>` : `<span class="note num">× ${l.qty}</span>`}
        <span class="lt">${l.total == null ? "—" : fmt(l.total)}</span>
        ${editable ? `<button class="rm" data-rm="${p.id}">Eliminar</button>` : ""}
      </div>
    </div>`;
  }).join("");
}
function stepsEl(i) { return `<div class="steps" aria-label="Progreso">${["1 Carrito", "2 Resumen", "3 WhatsApp"].map((s, k) => `<span ${k === i ? 'aria-current="step"' : k < i ? 'class="done"' : ""}>${s}</span>`).join("")}</div>`; }

}

function footerHTML() {
  return `<div class="wrap"><div class="cols">
    <div style="display:grid;gap:12px;align-content:start"><span class="logo"><svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="12.5" y="5" width="3" height="18" rx="1.5" fill="var(--border)"/><rect x="8" y="9" width="12" height="5" rx="1" fill="var(--accent)"/></svg><b style="color:var(--fg)">VOLT<i> DJ</i></b></span><p>${STORE.tagline}</p><p><em class="ph">Razón social · NIT</em></p></div>
    <div><h4>Tienda</h4><ul>${CATEGORIES.slice(0, 5).map((c) => `<li>${c.name}</li>`).join("")}<li>Ofertas</li></ul></div>
    <div><h4>Ayuda</h4><ul><li>Envíos y garantías</li><li>Preguntas frecuentes</li><li>Cómo comprar</li><li>Contacto</li></ul></div>
    <div><h4>Contacto</h4><ul><li><em class="ph">WhatsApp comercial</em></li><li><em class="ph">Correo</em></li><li><em class="ph">Dirección / showroom</em></li><li><em class="ph">Horario</em></li><li><em class="ph">Redes sociales</em></li></ul></div>
  </div><div class="legal"><span>© 2026 ${STORE.name}. <em class="ph">Razón social</em></span><span>Política de privacidad · Términos y condiciones · <em class="ph">Enlace SIC / PQR</em></span></div></div>`;
}

/* ================= Router & eventos ================= */
const ROUTES = { inicio: homeView, catalogo: catalogView, producto: productView, carrito: cartView, pedido: orderView, sistema: systemView, mapa: mapView, info: infoView };
function render(scroll = true) {
  let r = (location.hash || "#inicio").slice(1);
  if (r === "ofertas") { state.onlyPromo = true; state.cat = null; r = "catalogo"; }
  if (!ROUTES[r]) r = "inicio";
  view.innerHTML = ROUTES[r]();
  document.querySelectorAll(".tool nav a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === "#" + r ? "page" : "false"));
  $("#catnav").innerHTML = `<button class="hot" data-go="ofertas">Ofertas</button>` + CATEGORIES.map((c) => `<button data-cat="${c.id}" aria-current="${r === "catalogo" && state.cat === c.id}">${c.name}</button>`).join("");
  if (scroll) document.getElementById("device").scrollIntoView({ block: "start" });
}
function go(r) { if (location.hash === "#" + r) render(); else location.hash = r; }
function updateBadge() { const n = cart.items.reduce((s, i) => s + i.qty, 0); const b = $("#cartcount"); b.textContent = n; b.hidden = !n; }
let toastT;
function toast(html) { const t = $("#toast"); t.innerHTML = html; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.matches("[data-wa]") && !whatsapp.configured()) { e.preventDefault(); toast("Número de WhatsApp sin configurar en este prototipo"); return; }
  if (t.dataset.go) { if (t.dataset.go === "ofertas") { resetFilters(); state.onlyPromo = true; go("catalogo"); render(); return; } if (t.dataset.go === "catalogo") { state.q = ""; } go(t.dataset.go); return; }
  if (t.dataset.cat !== undefined) { resetFilters(); state.cat = t.dataset.cat || null; location.hash === "#catalogo" ? render() : go("catalogo"); return; }
  if (t.dataset.open) { state.productId = t.dataset.open; location.hash === "#producto" ? render() : go("producto"); return; }
  if (t.dataset.add) { const qty = t.hasAttribute("data-qty1") ? 1 : Math.max(1, parseInt($("#pqty")?.value, 10) || 1); const p = byId(t.dataset.add); const before = cart.items.find((i) => i.id === p.id)?.qty || 0; cart.add(p.id, qty); const after = cart.items.find((i) => i.id === p.id).qty; toast(after - before < qty ? `Límite de ${p.maxQty} unidades para este producto <button data-go="carrito">Ver carrito</button>` : `Añadido al carrito <button data-go="carrito">Ver carrito</button>`); render(false); return; }
  if (t.dataset.pq) { const i = $("#pqty"); const p = byId(state.productId); i.value = Math.max(1, Math.min(p.maxQty, (parseInt(i.value, 10) || 1) + +t.dataset.pq)); return; }
  if (t.dataset.q) { const l = cart.items.find((i) => i.id === t.dataset.q); cart.setQty(t.dataset.q, l.qty + +t.dataset.d); render(false); return; }
  if (t.dataset.rm) { const removed = cart.items.find((i) => i.id === t.dataset.rm); cart.remove(t.dataset.rm); render(false); if (removed) { window._undo = removed; toast(`Producto eliminado <button data-act="undo">Deshacer</button>`); } return; }
  if (t.dataset.unchip) { const k = t.dataset.unchip; if (k === "q") state.q = ""; else if (k === "promo") state.onlyPromo = false; else if (k === "price") { state.min = state.max = ""; } else if (k.startsWith("b:")) state.brands.delete(k.slice(2)); else if (k.startsWith("a:")) state.avail.delete(k.slice(2)); render(false); return; }
  const act = t.dataset.act;
  if (act === "undo" && window._undo) { cart.items.push(window._undo); window._undo = null; cart.save(); render(false); $("#toast").hidden = true; }
  if (act === "clear") { const prev = cart.items.slice(); cart.clear(); render(false); window._undoAll = prev; toast(`Carrito vaciado <button data-act="undoall">Deshacer</button>`); }
  if (act === "undoall" && window._undoAll) { cart.items = window._undoAll; window._undoAll = null; cart.save(); render(false); $("#toast").hidden = true; }
  if (act === "filters") { state.filtersOpen = !state.filtersOpen; render(false); }
  if (act === "clearf") { resetFilters(); render(false); }
  if (act === "copy") { const txt = $("#msgprev").textContent; navigator.clipboard?.writeText(txt).then(() => toast("Mensaje copiado"), () => { const r = document.createRange(); r.selectNodeContents($("#msgprev")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selecciona y copia el mensaje"); }); }
  if (t.matches("[data-send]")) { if (!whatsapp.configured()) { e.preventDefault(); toast("Configura el número de WhatsApp para activar el envío"); } else { toast(`Abrimos WhatsApp con tu pedido ${orderId}. Envía el mensaje para que un asesor lo reciba.`); } }
  if (t.closest(".tool .dev")) { const w = t.dataset.w; $("#device").dataset.w = w; document.querySelectorAll(".tool .dev button").forEach((b) => b.setAttribute("aria-pressed", b === t)); try { localStorage.setItem("voltdj.proto.w", w); } catch (e) {} }
});
function resetFilters() { state.cat = null; state.brands.clear(); state.avail.clear(); state.onlyPromo = false; state.min = state.max = ""; state.sort = "rel"; }
document.addEventListener("change", (e) => {
  const f = e.target.dataset.f; if (!f) { if (e.target.dataset.qi) { cart.setQty(e.target.dataset.qi, parseInt(e.target.value, 10)); render(false); } return; }
  if (f === "cat") state.cat = e.target.value || null;
  if (f === "brand") e.target.checked ? state.brands.add(e.target.value) : state.brands.delete(e.target.value);
  if (f === "avail") e.target.checked ? state.avail.add(e.target.value) : state.avail.delete(e.target.value);
  if (f === "promo") state.onlyPromo = e.target.checked;
  if (f === "min" || f === "max") state[f] = e.target.value.replace(/\D/g, "");
  if (f === "sort") state.sort = e.target.value;
  render(false);
});
document.addEventListener("input", (e) => {
  if (e.target.matches("[data-city]")) { state.city = e.target.value; const r = cart.resolve(); $("#msgprev").textContent = whatsapp.buildOrderMessage(r, { orderId, city: state.city }); }
});
document.querySelectorAll("[data-search]").forEach((f) => f.addEventListener("submit", (e) => { e.preventDefault(); resetFilters(); state.q = f.querySelector("input").value; document.querySelectorAll("[data-search] input").forEach((i) => (i.value = state.q)); location.hash === "#catalogo" ? render() : go("catalogo"); }));
window.addEventListener("hashchange", () => render());

/* Init */
$("#topbar").innerHTML = STORE.topbar.map((t) => `<span class="ph">${t.replace(/[⟨⟩]/g, "")}</span>`).join("");
$("#footer").innerHTML = footerHTML();
cart.load();
if (!cart.items.length) { cart.items = [{ id: "p01", qty: 1 }, { id: "p08", qty: 2 }, { id: "p12", qty: 2 }]; }
updateBadge();
try { const w = localStorage.getItem("voltdj.proto.w"); if (w) { $("#device").dataset.w = w; document.querySelectorAll(".tool .dev button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.w === w)); } } catch (e) {}
render(false);
</script>
